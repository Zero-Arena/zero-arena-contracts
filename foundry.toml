[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 1000, depth = 50 }

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
galileo = "${GALILEO_RPC_URL}"

[etherscan]
mainnet = { key = "${MAINNET_EXPLORER_KEY}", url = "${MAINNET_EXPLORER_URL}" }
galileo = { key = "${GALILEO_EXPLORER_KEY}", url = "${GALILEO_EXPLORER_URL}" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
